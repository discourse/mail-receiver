name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Rubocop
        run: bundle exec rubocop

      - name: Syntax Tree
        run: |
          set -E
          bundle exec stree check Gemfile discourse_mail_receiver.gemspec $(git ls-files '*.rb')

      - name: Tests
        run: bundle exec rake test

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Release Gem
        uses: discourse/publish-rubygems-action@v3
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          GIT_EMAIL: team@discourse.org
          GIT_NAME: discoursebot

  image:
    needs: build
    runs-on: ubuntu-latest
    env:
      BUILDKIT_PROGRESS: plain
      DOCKER_IMAGE: discourse/mail-receiver
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build image
        if: env.PUSH != 'true'
        run: docker buildx build --platform linux/amd64 --tag "${DOCKER_IMAGE}:test" .

      - name: Build and push image
        if: env.PUSH == 'true'
        run: |
          timestamp=$(date -u +%Y%m%d%H%M%S)
          docker buildx build --platform linux/amd64 --push \
            --tag "${DOCKER_IMAGE}:${timestamp}" \
            --tag "${DOCKER_IMAGE}:release" \
            .
